<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <rect width="800" height="560" fill="#F5F5F4"/>
  <!-- контур этажа -->
  <rect x="90" y="70" width="620" height="420" fill="none" stroke="#1C1C1B" stroke-width="8"/>
  <!-- лестнично-лифтовой узел по центру -->
  <rect x="350" y="230" width="100" height="100" fill="#fff" stroke="#1C1C1B" stroke-width="4"/>
  <line x1="350" y1="260" x2="450" y2="260" stroke="#B9B9B6" stroke-width="2"/>
  <line x1="350" y1="300" x2="450" y2="300" stroke="#B9B9B6" stroke-width="2"/>
  <text x="400" y="285" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="12" fill="#8A8A87">Л/К</text>
  <!-- квартиры вокруг узла: №101 подсвечена как текущая -->
  <rect x="90" y="70" width="180" height="160" fill="#FBE9E6" stroke="#1C1C1B" stroke-width="3"/>
  <text x="180" y="155" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="20" font-weight="700" fill="#E30413">№101</text>
  <rect x="270" y="70" width="180" height="160" fill="#fff" stroke="#1C1C1B" stroke-width="3"/>
  <text x="360" y="155" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="18" fill="#4A4A49">№102</text>
  <rect x="450" y="70" width="260" height="160" fill="#fff" stroke="#1C1C1B" stroke-width="3"/>
  <text x="580" y="155" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="18" fill="#4A4A49">№103</text>
  <rect x="90" y="330" width="180" height="160" fill="#fff" stroke="#1C1C1B" stroke-width="3"/>
  <text x="180" y="415" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="18" fill="#4A4A49">№106</text>
  <rect x="270" y="330" width="180" height="160" fill="#fff" stroke="#1C1C1B" stroke-width="3"/>
  <text x="360" y="415" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="18" fill="#4A4A49">№105</text>
  <rect x="450" y="330" width="260" height="160" fill="#fff" stroke="#1C1C1B" stroke-width="3"/>
  <text x="580" y="415" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="18" fill="#4A4A49">№104</text>
  <!-- подпись -->
  <text x="400" y="40" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="15" letter-spacing="2" fill="#8A8A87">ПЛАН НА ЭТАЖЕ</text>
  <text x="400" y="530" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="20" font-weight="700" fill="#1C1C1B">Литер 1 · 3 этаж</text>
