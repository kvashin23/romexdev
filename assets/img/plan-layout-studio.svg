<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <rect width="800" height="560" fill="#F5F5F4"/>
  <!-- наружные стены -->
  <rect x="120" y="60" width="560" height="440" fill="none" stroke="#1C1C1B" stroke-width="8"/>
  <!-- перегородка санузла -->
  <path d="M120 300 H260 V500" fill="none" stroke="#1C1C1B" stroke-width="6"/>
  <!-- кухонная зона -->
  <path d="M480 60 V220 H680" fill="none" stroke="#1C1C1B" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- окна -->
  <rect x="230" y="56" width="120" height="8" fill="#E30413"/>
  <rect x="500" y="56" width="120" height="8" fill="#E30413"/>
  <!-- входная дверь -->
  <path d="M120 420 A40 40 0 0 1 160 460" fill="none" stroke="#8A8A87" stroke-width="2"/>
  <rect x="118" y="418" width="6" height="42" fill="#8A8A87"/>
  <!-- мебель: кровать -->
  <rect x="300" y="330" width="160" height="110" rx="6" fill="#fff" stroke="#B9B9B6" stroke-width="2"/>
  <rect x="300" y="330" width="160" height="26" fill="#EDEDEB"/>
  <!-- кухонный гарнитур -->
  <rect x="490" y="80" width="170" height="30" fill="#fff" stroke="#B9B9B6" stroke-width="2"/>
  <circle cx="620" cy="95" r="10" fill="none" stroke="#B9B9B6" stroke-width="2"/>
  <!-- санузел -->
  <rect x="150" y="330" width="60" height="40" rx="18" fill="#fff" stroke="#B9B9B6" stroke-width="2"/>
  <rect x="150" y="440" width="80" height="40" fill="#fff" stroke="#B9B9B6" stroke-width="2"/>
  <!-- подпись и метраж -->
  <text x="400" y="530" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="22" font-weight="700" fill="#1C1C1B">Студия · 24,3 м²</text>
  <text x="400" y="40" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="15" letter-spacing="2" fill="#8A8A87">ПЛАНИРОВКА</text>
</svg>
